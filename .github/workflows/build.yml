name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: OpenCode version, without v, or latest
        required: true
        default: latest
        type: string
      publish:
        description: Publish a GitHub Release after Bionic smoke passes
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: opencode-termux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve requested OpenCode version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = latest ]; then
            version="$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name | ltrimstr("v")')"
          else
            version="${REQUESTED#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid OpenCode version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git tag -l "v$version" | grep -q .; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test

  bionic:
    needs: [resolve, tests]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || needs.resolve.outputs.unreleased == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      package: ${{ steps.package.outputs.package }}
      version: ${{ needs.resolve.outputs.version }}
    env:
      TERMUX_DOCKER_IMAGE: termux/termux-docker@sha256:66fb9c3f11ed1a5b2096a8e335fdee198567acc09cfe3b2753a6f85f4ef91ead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test inside Bionic Termux
        env:
          OPENCODE_VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker pull "$TERMUX_DOCKER_IMAGE"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --privileged \
            -e OPENCODE_VERSION_INPUT="$OPENCODE_VERSION" \
            -e GITHUB_TOKEN="$GH_TOKEN" \
            -e TERMUX_DOCKER_IMAGE="$TERMUX_DOCKER_IMAGE" \
            -v "$GITHUB_WORKSPACE:/data/data/com.termux/files/home/opencode-termux" \
            -w /data/data/com.termux/files/home/opencode-termux \
            "$TERMUX_DOCKER_IMAGE" \
            bash .github/ci/bionic-build.sh

      - name: Verify Bionic build manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          doc = json.load(open("dist/build-manifest.json"))
          assert doc["opencode"] == "${{ needs.resolve.outputs.version }}", doc
          assert doc["native_assets"]["result"] == "pass", doc
          assert doc["tui_smoke"] == "pass", doc
          assert doc["release_eligible"] is True, doc
          print(json.dumps(doc, indent=2))
          PY

      - name: Resolve package name
        id: package
        run: echo "package=$(cat dist/package-name)" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.package }}
          path: dist/release/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [resolve, bionic]
    if: >-
      needs.resolve.outputs.unreleased == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.bionic.outputs.version }}
      PACKAGE: ${{ needs.bionic.outputs.package }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bionic.outputs.package }}
          path: artifact

      - name: Publish verified Bionic release
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          OpenCode v$VERSION for Termux / Android AArch64.

          Built from the official anomalyco/opencode release inside the pinned
          Termux Bionic container. Native ELF audit, FFF, watcher, PTY and real
          TUI smoke tests passed before publication.

          Install:

              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash
          EOF
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenCode $VERSION · Termux" \
            --notes-file release-notes.md \
            "artifact/$PACKAGE.zip" \
            "artifact/$PACKAGE.zip.sha256" \
            "artifact/build-manifest.json"
