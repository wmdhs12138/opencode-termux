name: build

# OpenCode is MIT, so the release job publishes the built binary itself.
#
#   resolve -- picks the OpenCode version and the release tag (vX.Y.Z, or
#              vX.Y.Z-rN for a manual re-cut after toolchain changes) and
#              decides whether anything new needs to be released.
#   tests   -- Python and shell regression tests; pull requests stop here.
#   bionic  -- ARM64 runner + pinned termux-docker. Builds the Bionic native
#              assets in Termux, compiles OpenCode from source on the runner,
#              then executes the binary in Termux; contents stay read-only.
#   release -- the only job with write permission; publishes the package.
#
# Toolchain changes are not released on their own: they ship with the next
# OpenCode version, or now via workflow_dispatch with recut=true. See docs/ci.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: OpenCode version, without v, or latest
        required: true
        default: latest
        type: string
      recut:
        description: Re-release an already released version (toolchain changed)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: opencode-termux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags tell us what is already released
          persist-credentials: false

      - name: Resolve requested OpenCode version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
          RECUT: ${{ github.event_name == 'workflow_dispatch' && inputs.recut || 'false' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = latest ]; then
            V="$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name | ltrimstr("v")')"
          else
            V="${REQUESTED#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid OpenCode version: $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # An immutable release reserves its tag name forever, so a re-cut
          # (or a yanked release) becomes v$V-rN; both forms count as released.
          TAGS="$(git tag -l)"
          if grep -qE "^v$V(-r[0-9]+)?$" <<<"$TAGS"; then
            if [ "$RECUT" = true ]; then
              N=1
              while grep -qx "v$V-r$N" <<<"$TAGS"; do N=$((N+1)); done
              echo "tag=v$V-r$N" >> "$GITHUB_OUTPUT"
              echo "unreleased=true" >> "$GITHUB_OUTPUT"
              echo "re-cutting v$V as v$V-r$N"
            else
              echo "tag=v$V" >> "$GITHUB_OUTPUT"
              echo "unreleased=false" >> "$GITHUB_OUTPUT"
              echo "v$V already has a release"
            fi
          else
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
            echo "v$V is unreleased"
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test

  bionic:
    needs: [resolve, tests]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || needs.resolve.outputs.unreleased == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      package: ${{ steps.package.outputs.package }}
      version: ${{ needs.resolve.outputs.version }}
    env:
      TERMUX_DOCKER_IMAGE: termux/termux-docker@sha256:66fb9c3f11ed1a5b2096a8e335fdee198567acc09cfe3b2753a6f85f4ef91ead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Bionic native assets inside Termux
        run: |
          set -euo pipefail
          docker pull "$TERMUX_DOCKER_IMAGE"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/data/data/com.termux/files/home/opencode-termux" \
            -w /data/data/com.termux/files/home/opencode-termux \
            "$TERMUX_DOCKER_IMAGE" \
            bash .github/ci/bionic-build.sh natives
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      # Upstream's install scripts run node-gyp, which needs a current Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Not in Termux: scripts/compile.sh explains why.
      - name: Compile OpenCode from source
        env:
          OPENCODE_VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install setuptools || pip install setuptools || true
          make fetch-source VERSION="$OPENCODE_VERSION"
          make compile
          rm -rf work/build/src

      - name: Verify inside Termux and package
        run: |
          set -euo pipefail
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/data/data/com.termux/files/home/opencode-termux" \
            -w /data/data/com.termux/files/home/opencode-termux \
            "$TERMUX_DOCKER_IMAGE" \
            bash .github/ci/bionic-build.sh verify "$TERMUX_DOCKER_IMAGE"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Verify Bionic build manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          doc = json.load(open("dist/build-manifest.json"))
          assert doc["opencode"] == "${{ needs.resolve.outputs.version }}", doc
          assert doc["source"]["tag"] == "v" + doc["opencode"], doc
          assert doc["native_assets"]["result"] == "pass", doc
          assert doc["tui_smoke"] == "pass", doc
          assert doc["release_eligible"] is True, doc
          print(json.dumps(doc, indent=2))
          PY

      - name: Resolve package name
        id: package
        run: echo "package=$(cat dist/package-name)" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.package }}
          path: dist/release/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [resolve, bionic]
    if: needs.resolve.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      PACKAGE: ${{ needs.bionic.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # previous release tags, for the notes
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bionic.outputs.package }}
          path: artifact

      - name: Publish verified Bionic release
        run: |
          set -euo pipefail
          ASSETS="artifact/$PACKAGE.zip artifact/$PACKAGE.zip.sha256 artifact/build-manifest.json"
          for f in $ASSETS; do
            [ -f "$f" ] || { echo "::error::missing asset $f"; exit 1; }
          done
          (cd artifact && sha256sum -c "$PACKAGE.zip.sha256")

          # Toolchain changes since the previous release, for the notes: the
          # highest version tag this commit contains. Not `git describe`, which
          # picks arbitrarily when two releases share a commit.
          PREV="$(git tag -l 'v*' --merged "$GITHUB_SHA" | grep -vxF "$TAG" | sort -V | tail -1 || true)"
          if [ -n "$PREV" ]; then
            git log --oneline --no-decorate "$PREV..$GITHUB_SHA" -- . \
              ':(exclude)docs' ':(exclude)tests' ':(exclude)*.md' > changelog.txt
          else
            : > changelog.txt
          fi

          # /releases/latest is what install.sh and `opencode upgrade` follow.
          # Only the highest OpenCode version may hold it, so re-cutting an
          # older version cannot roll every installation back.
          HIGHEST="$(git tag -l 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)(-r[0-9]+)?$/\1/p' \
                     | sort -V | tail -1)"
          LATEST=true
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            LATEST=false
          fi

          # --target pins the tag to the commit this run built.
          publish() {
            python3 .github/release_notes.py notes.md \
              --manifest artifact/build-manifest.json --tag "$1" \
              --commit "$GITHUB_SHA" --predecessor "${PREV:--}" --changelog changelog.txt
            title="OpenCode $VERSION · Termux"
            case "$1" in *-r*) title="$title (${1##*-})" ;; esac
            gh release create "$1" --target "$GITHUB_SHA" \
              --latest="$LATEST" --title "$title" --notes-file notes.md $ASSETS
          }

          # A deleted immutable release still reserves its tag name. If the API
          # rejects the name, take the next free v$VERSION-rN.
          set +e
          OUT="$(publish "$TAG" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$RC" != "0" ]; then
            if ! printf '%s' "$OUT" | grep -q 'immutable release'; then
              exit "$RC"
            fi
            N=1
            while git ls-remote --tags origin "refs/tags/v$VERSION-r$N" | grep -q .; do
              N=$((N+1))
            done
            echo "$TAG is reserved by an immutable release; re-cutting as v$VERSION-r$N"
            TAG="v$VERSION-r$N"
            publish "$TAG"
          fi
          echo "released $TAG"
